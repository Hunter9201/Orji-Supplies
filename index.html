<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orji Supplies – Shop Kampala, Delivered</title>
<meta name="description" content="Groceries, electronics, fashion, furniture. Retail and wholesale in Uganda. Order on WhatsApp.">
<link rel="icon" href="https://i.postimg.cc/Kjyz2mXg/Chat-GPT-Image-Sep-9-2025-08-55-57-AM.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14231b;--leaf:#1f7a4d;--leaf-d:#155c39;--mango:#f5a524;--paper:#fbfaf7;--card:#fff;--line:#e6e2d8;--mute:#6b7469;--red:#c8372d;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 14px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-row{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{font-weight:800;font-size:1.25rem;color:var(--leaf);white-space:nowrap}
.search{flex:1;display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:0 14px;min-height:48px}
.search:focus-within{border-color:var(--leaf)}
.search input{flex:1;border:0;outline:0;background:none;min-width:0;padding:10px 0}
.wa-top{display:none;background:#25D366;color:#fff;font-weight:600;padding:12px 16px;border-radius:999px;text-decoration:none;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:.92rem;min-height:40px;text-transform:capitalize}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* intro strip */
.strip{display:flex;gap:18px;flex-wrap:wrap;padding:14px 0 4px;font-size:.9rem;color:var(--mute)}
.strip b{color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.bar h1{font-size:1.15rem;font-weight:800}
.bar select{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;min-height:44px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}.wa-top{display:inline-block}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pic{position:relative;aspect-ratio:1/1;background:#f2f0ea;width:100%}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.tag{position:absolute;top:8px;left:8px;background:var(--mango);color:var(--ink);font-weight:800;font-size:.72rem;padding:3px 9px;border-radius:999px}
.tag.sale{background:var(--red);color:#fff}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600;font-size:.95rem;line-height:1.25;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.price{font-weight:800;font-size:1.1rem;color:var(--leaf)}
.price small{font-weight:400;color:var(--mute);font-size:.78rem}
.old{color:var(--mute);text-decoration:line-through;font-size:.82rem;font-weight:400;margin-left:4px}
.bulk{font-size:.78rem;color:var(--mute)}
.bulk b{color:var(--leaf-d)}
.low{font-size:.78rem;color:var(--red);font-weight:600}
.buy{margin-top:auto;padding-top:8px}
.add{width:100%;min-height:46px;background:var(--leaf);color:#fff;border-radius:11px;font-weight:700}
.add:hover{background:var(--leaf-d)}
.add:disabled{background:#cfcfc8;cursor:not-allowed}
.step{display:flex;align-items:center;justify-content:space-between;min-height:46px;border:2px solid var(--leaf);border-radius:11px;overflow:hidden}
.step button{width:52px;height:46px;font-size:1.4rem;font-weight:700;color:var(--leaf)}
.step button:active{background:#e5f3ec}
.step span{font-weight:800}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--mute)}
.empty button{margin-top:12px;color:var(--leaf);font-weight:700;text-decoration:underline}
.skel{height:280px;border-radius:var(--r);background:linear-gradient(90deg,#eeece5 25%,#f6f4ee 50%,#eeece5 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

/* cart bar */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:14px 18px;display:none;justify-content:space-between;align-items:center;width:calc(100% - 24px);min-height:58px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cartbar.on{display:flex}
.cartbar b{font-size:1.05rem}
.cartbar .go{background:var(--mango);color:var(--ink);font-weight:800;padding:9px 16px;border-radius:10px}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:40;display:none}
.veil.on{display:block}
.sheet{position:fixed;z-index:41;background:#fff;left:0;right:0;bottom:0;max-height:92vh;border-radius:22px 22px 0 0;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{display:flex}
@media(min-width:720px){.sheet{left:auto;top:0;right:0;bottom:0;width:440px;max-height:none;border-radius:0}.sheet.center{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:520px;max-height:90vh;border-radius:20px}}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh-head h2{font-size:1.15rem}
.x{width:44px;height:44px;border-radius:50%;font-size:1.3rem}
.x:hover{background:#f1efe8}
.sh-body{overflow-y:auto;padding:14px 16px;flex:1}
.sh-foot{padding:14px 16px;border-top:1px solid var(--line)}
.line{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:64px;height:64px;object-fit:contain;background:#f2f0ea;border-radius:10px;flex:none}
.line .m{flex:1;min-width:0}
.line .n{font-weight:600;font-size:.92rem}
.line .step{min-height:38px;width:120px;margin-top:6px}
.line .step button{height:38px;width:38px}
.line .t{font-weight:800;white-space:nowrap}
.sum{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:800;margin-bottom:12px}
.saved{color:var(--leaf-d);font-size:.85rem;font-weight:600;margin:-6px 0 10px}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:.82rem;color:var(--mute);margin-bottom:3px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px}
.send{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;background:#25D366;color:#fff;font-weight:800;border-radius:13px;text-decoration:none;font-size:1.02rem}
.note{text-align:center;color:var(--mute);font-size:.8rem;margin-top:8px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin-bottom:12px}
.gal img{flex:none;width:100%;scroll-snap-align:center;max-height:340px;object-fit:contain;background:#f2f0ea;border-radius:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;font-size:.9rem}
.facts div{background:var(--paper);border-radius:10px;padding:10px}
.facts b{display:block;font-size:.75rem;color:var(--mute);font-weight:600}
.acct{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;white-space:nowrap}
.acct[hidden]{display:none}
.toast{max-width:90vw;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
footer{margin-top:40px;padding:28px 0;border-top:1px solid var(--line);color:var(--mute);font-size:.88rem;text-align:center}
footer a{color:var(--leaf);font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <span class="brand">Orji Supplies</span>
      <label class="search"><span aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off"></label>
      <a class="wa-top" id="waTop" target="_blank" rel="noopener">Chat on WhatsApp</a>
      <button class="acct" id="acct">Sign in</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </div>
</header>

<main class="wrap">
  <div class="strip"><span><b>Cash on delivery</b> in Kampala</span><span><b>Free delivery</b> over USh 500,000</span><span><b>Wholesale prices</b> apply automatically</span></div>
  <div class="bar"><h1 id="count">Products</h1>
    <select id="sort" aria-label="Sort products">
      <option value="popular">Popular first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="new">Newest</option>
    </select></div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<footer><div class="wrap">Orji Supplies · Discover Plaza, Kampala · <a id="waFoot" target="_blank" rel="noopener">+256 783 501 222</a></div></footer>

<div class="cartbar" id="cartbar"><span><b id="cbCount">0 items</b> · <span id="cbTotal"></span></span><button class="go" id="openCart">View cart</button></div>
<div class="veil" id="veil"></div>

<aside class="sheet" id="cart" aria-label="Your cart">
  <div class="sh-head"><h2>Your cart</h2><button class="x" data-close aria-label="Close cart">✕</button></div>
  <div class="sh-body" id="cartBody"></div>
  <div class="sh-foot" id="cartFoot"></div>
</aside>
<aside class="sheet center" id="detail" aria-label="Product details">
  <div class="sh-head"><h2 id="dTitle"></h2><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="sh-body" id="dBody"></div>
  <div class="sh-foot" id="dFoot"></div>
</aside>
<aside class="sheet center" id="auth" aria-label="Account">
  <div class="sh-head"><h2 id="aTitle">Sign in</h2><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="sh-body" id="aBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
const WA = '256783501222';
// ▼ Paste your Google Apps Script web app address here (ends in /exec). Leave as is to run without a backend.
const CFG = {url: 'https://script.google.com/macros/s/AKfycbxFbr080oreZkZsdW2TOGMRxX85hWlNuR6gsM8fjKdNshgMXRKiML3qkUPf_mrI1jqs/exec'};
const LIVE = CFG.url && CFG.url.startsWith('https://script.google.com/');
const NOPIC = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f2f0ea"/><text x="100" y="108" font-size="14" text-anchor="middle" fill="#9a9a90" font-family="sans-serif">No photo yet</text></svg>');
const $ = id => document.getElementById(id);
const S = {products: [], cat: 'all', q: '', sort: 'popular', cart: {}};
const money = n => 'USh ' + Math.round(n).toLocaleString('en-UG');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
};

/* Price for a quantity: wholesale price kicks in automatically at the minimum bulk quantity */
const bulkOn = (p, q) => p.moq > 1 && p.wholesale < p.retail && q >= p.moq;
const unitPrice = (p, q) => bulkOn(p, q) ? p.wholesale : p.retail;
const find = id => S.products.find(p => p.id === id);

function normalise(list){
  return list.map((p, i) => {
    const retail = Number(p.retailPrice) || 0;
    return {
      id: String(p.id || 'p' + i), name: p.name || 'Product', desc: p.desc || p.description || '',
      cat: (p.category || 'other').toLowerCase(), retail,
      wholesale: Number(p.wholesalePrice) || retail, moq: Number(p.moq) || 1,
      unit: p.unit || 'piece', stock: p.stock ?? 50, popular: !!p.popular, sale: !!p.sale, isNew: !!p.new,
      imgs: Array.isArray(p.imgs) && p.imgs.length ? p.imgs : [NOPIC], order: i
    };
  });
}
function samples(){
  const cats = ['groceries','electronics','clothes','shoes','furniture','cosmetics','books'], out = [];
  cats.forEach((c, ci) => { for(let i = 1; i <= 4; i++) out.push({id:`s_${c}_${i}`, name:`${c[0].toUpperCase()+c.slice(1)} item ${i}`, category:c, retailPrice:20000 + ci*7000 + i*9000, wholesalePrice:17000 + ci*6000 + i*7500, moq:10, stock:i===4?6:40, popular:i===1, sale:i===2, new:i===3}); });
  return out;
}

async function load(){
  $('grid').innerHTML = '<div class="skel"></div>'.repeat(8);
  let raw;
  try {
    if(!LIVE) throw 0;
    const r = await fetch(CFG.url);
    if(!r.ok) throw new Error('server ' + r.status);
    const data = await r.json();
    if(!Array.isArray(data)) throw new Error(data.error || 'unexpected reply');
    raw = data.map(p => ({id: p.id, name: p.name, desc: p.description, category: p.category, retailPrice: p.retail_price, wholesalePrice: p.wholesale_price,
      moq: p.moq, unit: p.unit, stock: p.stock, popular: p.popular, sale: p.sale, new: p.is_new, imgs: p.imgs}));
  } catch(e){ raw = samples(); toast(LIVE ? 'Could not load your sheet: ' + (e instanceof SyntaxError ? 'set Who has access to Anyone when deploying' : e.message) + '. Showing samples.' : 'Showing sample products', 7000); }
  S.products = normalise(raw);
  const saved = store.get('orji_cart2', {});
  Object.keys(saved).forEach(id => { if(find(id)) S.cart[id] = saved[id]; });
  drawChips(); draw(); drawCart();
}

function drawChips(){
  const cats = ['all', ...new Set(S.products.map(p => p.cat))];
  $('chips').innerHTML = cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===S.cat}">${c==='all'?'All':esc(c)}</button>`).join('');
}

function visible(){
  const t = S.q.toLowerCase();
  let l = S.products.filter(p => (S.cat === 'all' || p.cat === S.cat) && (!t || (p.name + ' ' + p.desc + ' ' + p.cat).toLowerCase().includes(t)));
  const s = S.sort;
  l.sort(s==='low' ? (a,b)=>a.retail-b.retail : s==='high' ? (a,b)=>b.retail-a.retail : s==='new' ? (a,b)=>(b.isNew-a.isNew)||(a.order-b.order) : (a,b)=>(b.popular-a.popular)||(a.order-b.order));
  return l;
}

function buyControl(p){
  const q = S.cart[p.id] || 0;
  if(p.stock <= 0) return '<button class="add" disabled>Sold out</button>';
  if(!q) return `<button class="add" data-add="${p.id}">Add to cart</button>`;
  return `<div class="step"><button data-dec="${p.id}" aria-label="Remove one">−</button><span>${q}</span><button data-inc="${p.id}" aria-label="Add one">+</button></div>`;
}

function card(p){
  const q = S.cart[p.id] || 0;
  const bulk = p.moq > 1 && p.wholesale < p.retail ? `<div class="bulk">Buy ${p.moq}+ : <b>${money(p.wholesale)}</b> each</div>` : '';
  const low = p.stock > 0 && p.stock <= 10 ? `<div class="low">Only ${p.stock} left</div>` : '';
  const tag = p.sale ? '<span class="tag sale">Sale</span>' : p.isNew ? '<span class="tag">New</span>' : '';
  return `<article class="card" data-id="${p.id}">
    <button class="pic" data-open="${p.id}" aria-label="View ${esc(p.name)}">${tag}<img src="${esc(p.imgs[0])}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='${NOPIC}'"></button>
    <div class="info"><button class="name" data-open="${p.id}">${esc(p.name)}</button>
    <div class="price">${money(unitPrice(p, q))}<small> / ${esc(p.unit)}</small></div>${bulk}${low}
    <div class="buy" id="buy-${p.id}">${buyControl(p)}</div></div></article>`;
}

function draw(){
  const l = visible();
  $('count').textContent = (S.cat === 'all' ? 'All products' : S.cat[0].toUpperCase() + S.cat.slice(1)) + ' (' + l.length + ')';
  $('grid').innerHTML = l.length ? l.map(card).join('') : `<div class="empty"><p>Nothing matches “${esc(S.q)}”.</p><button data-reset>Show all products</button></div>`;
}

/* cart */
function setQty(id, n){
  const p = find(id); if(!p) return;
  n = Math.max(0, Math.min(n, p.stock));
  if(n) S.cart[id] = n; else delete S.cart[id];
  store.set('orji_cart2', S.cart);
  const card_ = document.querySelector(`.card[data-id="${id}"]`);
  if(card_){ $('buy-' + id).innerHTML = buyControl(p); card_.querySelector('.price').firstChild.textContent = money(unitPrice(p, n)); }
  drawCart();
  if(detailId === id) drawDetail(id);
}
function totals(){
  let count = 0, total = 0, saved = 0;
  Object.entries(S.cart).forEach(([id, q]) => { const p = find(id); if(!p) return; count += q; total += q * unitPrice(p, q); saved += q * (p.retail - unitPrice(p, q)); });
  return {count, total, saved};
}
function drawCart(){
  const t = totals();
  $('cartbar').classList.toggle('on', t.count > 0);
  $('cbCount').textContent = t.count + (t.count === 1 ? ' item' : ' items');
  $('cbTotal').textContent = money(t.total);
  const ids = Object.keys(S.cart);
  $('cartBody').innerHTML = ids.length ? ids.map(id => { const p = find(id), q = S.cart[id], u = unitPrice(p, q);
    return `<div class="line"><img src="${esc(p.imgs[0])}" alt="" onerror="this.onerror=null;this.src='${NOPIC}'"><div class="m"><div class="n">${esc(p.name)}</div><div class="bulk">${money(u)} / ${esc(p.unit)}${bulkOn(p,q)?' · wholesale price':''}</div>
    <div class="step"><button data-dec="${id}" aria-label="Remove one">−</button><span>${q}</span><button data-inc="${id}" aria-label="Add one">+</button></div></div><div class="t">${money(q*u)}</div></div>`; }).join('')
    : '<div class="empty"><p>Your cart is empty.</p></div>';
  if(!ids.length){ $('cartFoot').innerHTML = ''; return; }
  const me = store.get('orji_me', {name:'', phone:'', place:''});
  $('cartFoot').innerHTML = `${t.saved > 0 ? `<div class="saved">You save ${money(t.saved)} with wholesale prices</div>` : ''}
    <label class="field"><span>Your name</span><input id="fName" value="${esc(me.name)}" autocomplete="name"></label>
    <label class="field"><span>Phone number</span><input id="fPhone" type="tel" value="${esc(me.phone || '')}" placeholder="07..." autocomplete="tel"></label>
    <label class="field"><span>Delivery location</span><input id="fPlace" value="${esc(me.place)}" placeholder="Area, street or landmark" autocomplete="street-address"></label>
    <div class="sum"><span>Total</span><span>${money(t.total)}</span></div>
    <a class="send" id="send" target="_blank" rel="noopener">Order on WhatsApp</a>
    <p class="note">Pay cash on delivery. We confirm on WhatsApp.</p>`;
  ['fName','fPhone','fPlace'].forEach(i => $(i).addEventListener('input', linkOrder));
  linkOrder();
  $('send').addEventListener('click', submitOrder);
}
function linkOrder(){
  const t = totals(), name = $('fName').value.trim(), place = $('fPlace').value.trim();
  store.set('orji_me', {name, place, phone: $('fPhone').value.trim()});
  let m = 'Hi Orji Supplies, I would like to order:\n\n';
  Object.entries(S.cart).forEach(([id, q]) => { const p = find(id), u = unitPrice(p, q); m += `• ${p.name} × ${q} ${p.unit} @ ${money(u)} = ${money(q*u)}\n`; });
  m += `\nTotal: ${money(t.total)}\n`;
  if(name) m += `Name: ${name}\n`;
  if(place) m += `Deliver to: ${place}\n`;
  m += 'Payment: cash on delivery';
  $('send').href = `https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
}

async function submitOrder(e){
  if(!LIVE) return; // no backend: the plain WhatsApp link runs instead
  e.preventDefault();
  const name = $('fName').value.trim(), phone = $('fPhone').value.trim(), place = $('fPlace').value.trim();
  if(!name || !phone || !place){ toast('Add your name, phone and location'); return; }
  const btn = $('send'), label = btn.textContent; btn.textContent = 'Placing your order…';
  try {
    let d;
    try {
      const r = await fetch(CFG.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({token: S.token || '', name, phone, place, items: Object.entries(S.cart).map(([id, qty]) => ({id, qty}))})});
      d = await r.json();
    } catch(x){ toast('Could not save online, sending on WhatsApp instead', 4000); location.href = btn.href; return; }
    if(d.error) throw new Error(d.error);
    let m = `Hi Orji Supplies, my order #${d.ref}:\n\n`;
    d.lines.forEach(l => { m += `• ${l.name} × ${l.qty} ${l.unit} = ${money(l.qty * l.unit_price)}\n`; });
    m += `\nTotal: ${money(d.total)}\nName: ${name}\nPhone: ${phone}\nDeliver to: ${place}\nPayment: cash on delivery`;
    S.cart = {}; store.set('orji_cart2', S.cart);
    location.href = `https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
  } catch(err){
    btn.textContent = label; toast(err.message);
    load(); // refresh stock so the cart matches what is really available
  }
}

/* product detail */
let detailId = null;
function openDetail(id){ detailId = id; drawDetail(id); show('detail'); }
function drawDetail(id){
  const p = find(id), q = S.cart[id] || 0;
  $('dTitle').textContent = p.name;
  $('dBody').innerHTML = `<div class="gal">${p.imgs.map(i => `<img src="${esc(i)}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src='${NOPIC}'">`).join('')}</div>
    <div class="price" style="font-size:1.5rem">${money(unitPrice(p, q))}<small> / ${esc(p.unit)}</small></div>
    ${p.desc ? `<p style="margin-top:8px">${esc(p.desc)}</p>` : ''}
    <div class="facts"><div><b>Availability</b>${p.stock<=0?'Sold out':p.stock<=10?'Only '+p.stock+' left':'In stock'}</div>
    <div><b>Wholesale</b>${p.moq>1&&p.wholesale<p.retail?money(p.wholesale)+' from '+p.moq:'Not offered'}</div></div>`;
  $('dFoot').innerHTML = `<div class="buy">${buyControl(p).replace(/data-(add|inc|dec)/g, 'data-$1')}</div>`;
}

/* accounts */
S.token = store.get('orji_token', ''); S.user = null;
let authMode = 'in';
async function acctCall(body){
  let d;
  try {
    const r = await fetch(CFG.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
    d = await r.json();
  } catch(e){ throw new Error('Could not reach the shop. Check your internet and try again.'); }
  if(d.error) throw new Error(d.error);
  return d;
}
function drawAcct(){ $('acct').textContent = S.user ? 'Hi, ' + String(S.user.name).split(' ')[0] : 'Sign in'; }
async function initAuth(){
  if(!LIVE){ $('acct').hidden = true; return; }
  if(S.token){ try { S.user = await acctCall({action: 'me', token: S.token}); } catch(e){ if(/sign in again/i.test(e.message)){ S.token = ''; store.set('orji_token', ''); } } }
  drawAcct();
}
function openAuth(){ authMode = 'in'; drawAuth(); show('auth'); }
function drawAuth(){
  if(S.user){
    $('aTitle').textContent = 'My account';
    $('aBody').innerHTML = `<p><b>${esc(S.user.name)}</b><br><small>${esc(S.user.phone)}</small></p><h3 style="margin:14px 0 4px">My orders</h3><div id="myOrders"><p class="bulk">Loading…</p></div>
      <button class="add" id="logout" style="margin-top:16px;background:#fff;color:var(--ink);border:2px solid var(--line)">Sign out</button>`;
    acctCall({action: 'orders', token: S.token}).then(d => {
      $('myOrders').innerHTML = d.orders.length ? d.orders.map(o => `<div class="line"><div class="m"><div class="n">#${esc(o.ref)} · ${esc(o.status)}</div><div class="bulk">${esc(o.date)} · ${esc(o.items)}</div></div><div class="t">${money(o.total)}</div></div>`).join('') : '<p class="bulk">No orders yet.</p>';
    }).catch(e => { $('myOrders').innerHTML = `<p class="bulk">${esc(e.message)}</p>`; });
    return;
  }
  const up = authMode === 'up';
  $('aTitle').textContent = up ? 'Create account' : 'Sign in';
  $('aBody').innerHTML = `<div class="chips" style="margin-bottom:10px"><button class="chip" data-mode="in" aria-pressed="${!up}">Sign in</button><button class="chip" data-mode="up" aria-pressed="${up}">Create account</button></div>
    ${up ? '<label class="field"><span>Your name</span><input id="aName" autocomplete="name"></label>' : ''}
    <label class="field"><span>Phone number</span><input id="aPhone" type="tel" placeholder="07..." autocomplete="username"></label>
    <label class="field"><span>Password${up ? ' (at least 6 characters)' : ''}</span><input id="aPass" type="password" autocomplete="${up ? 'new-password' : 'current-password'}"></label>
    <p class="low" id="aMsg"></p><button class="add" id="aGo">${up ? 'Create account' : 'Sign in'}</button>
    <p class="note">You can also order without an account.</p>`;
}
async function submitAuth(){
  const up = authMode === 'up', btn = $('aGo'), msg = $('aMsg'); msg.textContent = '';
  const body = {action: up ? 'register' : 'login', phone: $('aPhone').value.trim(), password: $('aPass').value};
  if(up) body.name = $('aName').value.trim();
  btn.disabled = true; btn.textContent = 'Please wait…';
  try {
    const d = await acctCall(body);
    S.token = d.token; S.user = {name: d.name, phone: d.phone}; store.set('orji_token', d.token);
    store.set('orji_me', {...store.get('orji_me', {}), name: d.name, phone: d.phone});
    drawAcct(); drawCart(); toast('Welcome, ' + String(d.name).split(' ')[0]); drawAuth();
  } catch(e){ msg.textContent = e.message; btn.disabled = false; btn.textContent = up ? 'Create account' : 'Sign in'; }
}
async function logout(){
  try { await acctCall({action: 'logout', token: S.token}); } catch(e){}
  S.token = ''; S.user = null; store.set('orji_token', ''); drawAcct(); hide(); toast('Signed out');
}
$('auth').addEventListener('keydown', e => { if(e.key === 'Enter' && $('aGo')) submitAuth(); });

/* sheets */
function show(id){ $(id).classList.add('on'); $('veil').classList.add('on'); document.body.style.overflow = 'hidden'; }
function hide(){ document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on')); $('veil').classList.remove('on'); document.body.style.overflow = ''; detailId = null; }
let tt; function toast(m, ms = 2200){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), ms); }

/* events (one delegated listener) */
document.addEventListener('click', e => {
  const b = e.target.closest('button, a'); if(!b) return;
  const d = b.dataset;
  if(d.add){ setQty(d.add, 1); toast('Added to cart'); }
  else if(d.inc) setQty(d.inc, (S.cart[d.inc] || 0) + 1);
  else if(d.dec) setQty(d.dec, (S.cart[d.dec] || 0) - 1);
  else if(d.open) openDetail(d.open);
  else if(d.mode){ authMode = d.mode; drawAuth(); }
  else if(b.id === 'acct') openAuth();
  else if(b.id === 'aGo') submitAuth();
  else if(b.id === 'logout') logout();
  else if(d.cat){ S.cat = d.cat; drawChips(); draw(); }
  else if(d.reset !== undefined){ S.q = ''; S.cat = 'all'; $('q').value = ''; drawChips(); draw(); }
  else if(d.close !== undefined) hide();
  else if(b.id === 'openCart') show('cart');
});
$('veil').addEventListener('click', hide);
document.addEventListener('keydown', e => { if(e.key === 'Escape') hide(); });
let st; $('q').addEventListener('input', e => { clearTimeout(st); st = setTimeout(() => { S.q = e.target.value.trim(); draw(); }, 200); });
$('sort').addEventListener('change', e => { S.sort = e.target.value; draw(); });
$('waTop').href = $('waFoot').href = `https://wa.me/${WA}`;
load(); initAuth();
</script>
</body>
</html>
